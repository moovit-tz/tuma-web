services:
  db:
    image: postgres:17-alpine
    container_name: tuma_postgres
    environment:
      POSTGRES_USER: tuma
      POSTGRES_PASSWORD: tuma
      POSTGRES_DB: tuma
    ports:
      - "5544:5432"
    volumes:
      - tuma_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: tuma_redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6390:6379"
volumes:
  tuma_pg:
