    # ── tuma.hudumika.tz — Tuma (landing page, portal, app API) ──
    server {
        listen 443 ssl;
        server_name tuma.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/tuma.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tuma.hudumika.tz/privkey.pem;
        client_max_body_size 10m;   # licence and proof-of-delivery photos (app limit 8 MB)
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $tuma_up http://tuma-portal:3000;
            proxy_pass $tuma_up;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
