    # ── nemo.co.tz ──
    server {
        listen 443 ssl;
        server_name nemo.co.tz;
        ssl_certificate     /etc/letsencrypt/live/nemo.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nemo.co.tz/privkey.pem;
        client_max_body_size 10m;
        # runtime DNS lookup: nginx must still boot if nemo-edge is down
        resolver 127.0.0.11 valid=10s ipv6=off;
        location / {
            set $nemo_up http://nemo-edge:80;
            proxy_pass $nemo_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }

