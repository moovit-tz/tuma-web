    # ── nemo.co.tz — HTTP: ACME challenge + redirect to HTTPS ──
    server {
        listen 80;
        server_name nemo.co.tz app.nemo.co.tz api.nemo.co.tz;
        location /.well-known/acme-challenge/ {
