    # ── ondi.hudumika.tz — id-portal (apps/web/ondi) serves / (login,
    #    authorize, personal + enterprise dashboard), the real API is under
    #    /v1/ (matches every product app's own ONDI_API_URL + "/v1"
    #    convention already baked into their builds). id-portal replaced
    #    ondi-auth-web here — that app's own dashboard/applications UI is
    #    superseded by id-portal's fuller enterprise/personal portal; the
    #    ondi-auth-web container is stopped, not deleted, in case anything
    #    still needs rolling back. ──
    server {
        listen 443 ssl;
        server_name ondi.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/sign.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sign.hudumika.tz/privkey.pem;
        # No trailing slash on proxy_pass here (unlike every other block in
        # this file) — ondi-api registers its own routes WITH the /v1 prefix
        # internally (app.ts: prefix: '/v1/auth' etc, confirmed against a
        # direct curl to the container), unlike every other service here
        # which registers bare paths. Stripping /v1/ before forwarding (the
        # other blocks' pattern) would 404 every route on this one.
        location /v1/ {
            proxy_pass http://ondi-api:7020;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Flutter web PWA (apps/mobile/ondi-auth) — its own small
        # container (ondi-auth-mobile, same pattern as ondi-api/
        # ondi-auth-web) rather than a bind-mounted static dir, so adding
        # it never requires touching this nginx container's volumes.
        # Trailing slash on both sides strips the /app/ prefix before
        # forwarding, same as the /v1/ block above.
        location /app/ {
            proxy_pass http://ondi-auth-mobile:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://id-portal:3023/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    # ── hudumika.tz — the Hudumika umbrella marketing site
    #    (apps/web/workspace, Next.js standalone server). www redirects to
    #    the apex rather than serving a second copy. Own dedicated cert
    #    (not the shared sign.hudumika.tz multi-SAN one), same precedent as
    #    kanji.hudumika.tz below. ──
    server {
        listen 443 ssl;
        server_name www.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hudumika.tz/privkey.pem;
        return 301 https://hudumika.tz$request_uri;
    }
    server {
        listen 443 ssl;
        server_name hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hudumika.tz/privkey.pem;
        location / {
            proxy_pass http://workspace-web:3030/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    # ── complyos-api.hudumika.tz — ComplyOS API only, no web frontend on
    #    this subdomain yet. All routes (auth/*, v1/*, health) already
    #    carry their full path from the app root, so everything is
    #    forwarded unchanged — no prefix to strip. ──
    server {
        listen 443 ssl;
        server_name complyos-api.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/complyos-api.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/complyos-api.hudumika.tz/privkey.pem;
        location / {
            proxy_pass http://complyos-api:9002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    # ── kanji.hudumika.tz — legacy host, permanently redirects to kanji.co.tz
    #    (phase-out planned; old APKs keep working through these redirects) ──
    server {
        listen 443 ssl;
        server_name kanji.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/kanji.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kanji.hudumika.tz/privkey.pem;
        # Installed APKs call this host directly, so API traffic is proxied,
        # not redirected (HTTP clients don't replay POST bodies across a 308).
        location ~ ^/(api|static|health)(/|$) {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $kanji_api_up http://kanji-api:4011;
            proxy_pass $kanji_api_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }
        location /downloads/ {
            return 308 https://app.kanji.co.tz$request_uri;
        }
        location = /admin {
            return 308 https://admin.kanji.co.tz/admin;
        }
        location / {
            return 308 https://kanji.co.tz$request_uri;
        }
    }

    # ── kanji.co.tz — step 1: ACME challenge only until certs are issued ──
    server {
        listen 80;
        server_name kanji.co.tz api.kanji.co.tz app.kanji.co.tz admin.kanji.co.tz;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── kanji.co.tz — landing page ──
    server {
        listen 443 ssl;
        server_name kanji.co.tz;
        ssl_certificate     /etc/letsencrypt/live/kanji.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kanji.co.tz/privkey.pem;
        root /usr/share/nginx/kanji-web;
        index index.html;
        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # Brand fonts are also loaded cross-origin via @font-face from the
        # public slip-results page served on api.kanji.co.tz — browsers
        # require a CORS header on the font response itself (unlike
        # images) or they silently refuse to apply it.
        location /fonts/ {
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # Masked public slip-results link (kanji.co.tz/paid-slips/<code>/verify)
        # — reverse-proxied straight through to the API's own endpoint so the
        # link never has to show api.kanji.co.tz or /api/v1 to a bettor.
        location /paid-slips/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $kanji_api_up http://kanji-api:4011;
            rewrite ^/paid-slips/(.*)$ /api/v1/paid-slips/$1 break;
            proxy_pass $kanji_api_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri.html $uri/ /index.html;
        }
    }

    # ── api.kanji.co.tz — Kanji Tipz API ──
    server {
        listen 443 ssl;
        server_name api.kanji.co.tz;
        ssl_certificate     /etc/letsencrypt/live/kanji.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kanji.co.tz/privkey.pem;
        client_max_body_size 20m;
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $kanji_api_up http://kanji-api:4011;
            proxy_pass $kanji_api_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── app.kanji.co.tz — mobile app downloads ──
    server {
        listen 443 ssl;
        server_name app.kanji.co.tz;
        ssl_certificate     /etc/letsencrypt/live/kanji.co.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kanji.co.tz/privkey.pem;
        root /usr/share/nginx/kanji-web;
        index index.html;
        location = / {
