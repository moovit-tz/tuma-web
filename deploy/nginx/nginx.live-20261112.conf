    # ── petti.hudumika.tz ──
    server {
        listen 443 ssl;
        server_name petti.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/sign.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sign.hudumika.tz/privkey.pem;
        root /usr/share/nginx/petti-web;
        index index.html;
        location /v1/ {
            proxy_pass http://petti-api:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # HuduPay's own webhook receiver (services/hudupay-api) — reused
        # under petti.hudumika.tz rather than a new subdomain, since a new
        # DNS record + cert isn on this host would need out-of-band setup.
        # Only the webhook path is public; collections/disbursements calls
        # from petti-api to hudupay-api stay on the internal docker network.
        location /hudupay-webhooks/ {
            proxy_pass http://hudupay-api:4020/v1/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
