worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Stock mime.types has no .mjs entry (pdf.js's worker ships as
    # pdf.worker.min.mjs) — falls through to the default_type above
    # (application/octet-stream), and a browser refuses to dynamically
    # import() a module served with a non-JS MIME type. Real breakage: the
    # sign editor's PDF preview failed on every real upload with "Failed to
    # fetch dynamically imported module" until this was added.
    types {
        application/javascript mjs;
    }
    sendfile      on;
    client_max_body_size 20m;

    # ── Plain HTTP — ACME challenge for cert renewal stays reachable here,
    #    everything else redirects to HTTPS. ──
    server {
        listen 80;
        server_name hudumika.tz www.hudumika.tz sign.hudumika.tz tasks.hudumika.tz calendar.hudumika.tz contacts.hudumika.tz petti.hudumika.tz notes.hudumika.tz ondi.hudumika.tz bliss.hudumika.tz kanji.hudumika.tz complyos-api.hudumika.tz tuma.hudumika.tz crm.hudumika.tz;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── tuma.hudumika.tz — Tuma (landing page, portal, app API) ──
    server {
        listen 443 ssl;
        server_name tuma.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/tuma.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tuma.hudumika.tz/privkey.pem;
        client_max_body_size 10m;   # licence and proof-of-delivery photos (app limit 8 MB)
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $tuma_up http://tuma-portal:3000;
            proxy_pass $tuma_up;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    # ── sign.hudumika.tz ──
    server {
        listen 443 ssl;
        server_name sign.hudumika.tz;
        ssl_certificate     /etc/letsencrypt/live/sign.hudumika.tz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sign.hudumika.tz/privkey.pem;
        root /usr/share/nginx/sign-web;
        index index.html;
        location /v1/ {
            proxy_pass http://sign-api:4004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # index.html has no fingerprint in its own filename (unlike
        # /assets/*, which are content-hashed by Vite and safe to cache
        # forever) — without this, a browser's heuristic freshness caching
        # can keep serving a stale index.html (pointing at an old,
        # deleted JS bundle) for a while after every deploy, even on a
        # brand-new tab. Real incident: exactly this happened on
        # calendar.hudumika.tz right after a deploy.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

